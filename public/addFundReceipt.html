<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Verification - Enexa ERP</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- SweetAlert2 for beautiful popups -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .verification-container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        
        .verification-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card-header-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .card-header-custom h2 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
        }
        
        .card-header-custom p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        
        .card-body-custom {
            padding: 40px 30px;
            text-align: center;
        }
        
        .spinner-container {
            margin: 20px 0;
        }
        
        .spinner-border-custom {
            width: 4rem;
            height: 4rem;
            border-width: 0.4rem;
            color: #667eea;
        }
        
        .transaction-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
        }
        
        .transaction-info .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .transaction-info .info-row:last-child {
            border-bottom: none;
        }
        
        .transaction-info .label {
            font-weight: 600;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .transaction-info .value {
            font-weight: 600;
            color: #212529;
            font-size: 1rem;
        }
        
        .loading-text {
            color: #6c757d;
            font-size: 1.1rem;
            margin-top: 20px;
        }
        
        .pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        /* Custom SweetAlert styling */
        .swal2-popup {
            border-radius: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .swal2-success {
            border-color: #28a745;
        }
        
        .swal2-error {
            border-color: #dc3545;
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            .verification-container {
                padding: 10px;
            }
            
            .card-header-custom {
                padding: 20px;
            }
            
            .card-header-custom h2 {
                font-size: 1.4rem;
            }
            
            .card-body-custom {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="verification-card">
            <div class="card-header-custom">
                <h2>
                    <i class="bi bi-shield-check me-2"></i>
                    Payment Verification
                </h2>
                <p>Please wait while we verify your transaction</p>
            </div>
            
            <div class="card-body-custom">
                <div class="spinner-container">
                    <div class="spinner-border spinner-border-custom pulse" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                
                <p class="loading-text pulse">
                    <strong>Verifying your payment...</strong>
                </p>
                
                <div class="transaction-info" id="transactionInfo" style="display: none;">
                    <div class="info-row">
                        <span class="label">
                            <i class="bi bi-hash me-1"></i>Transaction ID
                        </span>
                        <span class="value" id="txnIdDisplay">-</span>
                    </div>
                    <div class="info-row">
                        <span class="label">
                            <i class="bi bi-currency-rupee me-1"></i>Amount
                        </span>
                        <span class="value" id="amountDisplay">-</span>
                    </div>
                    <div class="info-row">
                        <span class="label">
                            <i class="bi bi-clock me-1"></i>Status
                        </span>
                        <span class="value text-primary">Processing...</span>
                    </div>
                </div>
                
                <p class="text-muted mt-4 mb-0" style="font-size: 0.85rem;">
                    <i class="bi bi-info-circle me-1"></i>
                    This may take a few seconds. Please do not close this window.
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.32/dist/sweetalert2.all.min.js"></script>
    
    <script>
        // Get URL parameters
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        
        // Extract transaction details from URL
        const txnId = getUrlParameter('txnId');
        const amount = getUrlParameter('amount');
        
        console.log('Transaction ID:', txnId);
        console.log('Amount:', amount);
        
        // Display transaction info if available
        if (txnId || amount) {
            document.getElementById('transactionInfo').style.display = 'block';
            
            if (txnId) {
                document.getElementById('txnIdDisplay').textContent = txnId;
            }
            
            if (amount) {
                document.getElementById('amountDisplay').textContent = '₹' + parseFloat(amount).toFixed(2);
            }
        }
        
        // Function to verify payment
        async function verifyPayment() {
            // Check if transaction ID exists
            if (!txnId) {
                // Show error popup
                Swal.fire({
                    icon: 'error',
                    title: 'Invalid Request',
                    text: 'Transaction ID not found in the URL.',
                    confirmButtonText: 'Go Back',
                    confirmButtonColor: '#dc3545',
                    allowOutsideClick: false,
                    allowEscapeKey: false
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = '/banking/add-fund-request';
                    }
                });
                return;
            }
            
            try {
                // Make API call to verify payment
                const response = await fetch('/api/add-money/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({
                        txnid: txnId
                    })
                });
                
                const data = await response.json();
                console.log('API Response:', data);
                
                // Check if payment was successful
                if (data.status === 1 || data.status === true || data.success === true) {
                    // Success popup
                    Swal.fire({
                        icon: 'success',
                        title: 'Payment Successful!',
                        html: `
                            <div class="text-start">
                                <p><strong>Your payment has been verified successfully.</strong></p>
                                ${data.data && data.data.utr ? `<p class="mb-1"><small><strong>UTR:</strong> ${data.data.utr}</small></p>` : ''}
                                ${amount ? `<p class="mb-1"><small><strong>Amount:</strong> ₹${parseFloat(amount).toFixed(2)}</small></p>` : ''}
                                <p class="mb-0"><small><strong>Transaction ID:</strong> ${txnId}</small></p>
                            </div>
                        `,
                        confirmButtonText: 'Go to Fund History',
                        confirmButtonColor: '#28a745',
                        allowOutsideClick: false,
                        allowEscapeKey: false,
                        timer: 5000,
                        timerProgressBar: true
                    }).then((result) => {
                        // Redirect to fund history or home page
                        window.location.href = '/banking/add-fund-history';
                    });
                } else {
                    // Failure popup
                    Swal.fire({
                        icon: 'error',
                        title: 'Payment Failed',
                        text: data.message || 'Unable to verify your payment. Please contact support if amount was deducted.',
                        confirmButtonText: 'Try Again',
                        confirmButtonColor: '#dc3545',
                        allowOutsideClick: false,
                        allowEscapeKey: false,
                        showCancelButton: true,
                        cancelButtonText: 'Go Back',
                        cancelButtonColor: '#6c757d'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // Reload page to try again
                            window.location.reload();
                        } else {
                            // Go back to add fund page
                            window.location.href = '/banking/add-fund-request';
                        }
                    });
                }
                
            } catch (error) {
                console.error('Error verifying payment:', error);
                
                // Error popup
                Swal.fire({
                    icon: 'error',
                    title: 'Verification Error',
                    text: 'An error occurred while verifying your payment. Please contact support.',
                    confirmButtonText: 'Contact Support',
                    confirmButtonColor: '#dc3545',
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                    showCancelButton: true,
                    cancelButtonText: 'Go Back',
                    cancelButtonColor: '#6c757d'
                }).then((result) => {
                    if (result.isConfirmed) {
                        // Go to support page or show contact info
                        window.location.href = '/support';
                    } else {
                        // Go back to add fund page
                        window.location.href = '/banking/add-fund-request';
                    }
                });
            }
        }
        
        // Auto-verify payment when page loads
        window.addEventListener('DOMContentLoaded', function() {
            // Add small delay for better UX
            setTimeout(function() {
                verifyPayment();
            }, 1500);
        });
        
        // Prevent user from leaving page during verification (optional)
        window.addEventListener('beforeunload', function(e) {
            // Only show warning if verification is in progress
            if (document.querySelector('.spinner-border-custom')) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        });
    </script>
</body>
</html>
